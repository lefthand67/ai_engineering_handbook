          files_yaml: |
            logic:
              - tools/scripts/check_adr.py
              - tools/tests/test_check_adr.py
            adr:
              - architecture/adr/adr_*.md
              - architecture/adr_index.md
          safe_output: true

      - name: Run Logic Tests
        if: steps.changed.outputs.logic_any_changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest tools/tests/test_check_adr.py

      - name: Run ADR Index Check
        if: steps.changed.outputs.adr_any_changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run tools/scripts/check_adr.py --verbose

  update-token-counts:
