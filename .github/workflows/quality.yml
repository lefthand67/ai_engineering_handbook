        with:
          files_yaml: |
            logic:
              - tools/scripts/update_token_counts.py
              - tools/tests/test_update_token_counts.py
              - tools/scripts/paths.py
          safe_output: true

      - name: Run Logic Tests
        if: steps.changed.outputs.logic_any_changed == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest tools/tests/test_update_token_counts.py
